# AeroSpace config — i3-style tiling for macOS
# Docs: https://nikitabobko.github.io/AeroSpace/guide

# Tray icon yerine sadece menubar emoji (opsiyonel)
after-login-command = []

# Aerospace başladığında JankyBorders + SketchyBar'ı otomatik başlat
after-startup-command = [
    'exec-and-forget sketchybar',
]

# Workspace değişince SketchyBar'a haber ver (highlight için)
exec-on-workspace-change = [
    '/bin/bash', '-c',
    'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE',
]

# Aerospace başladığında otomatik yeniden başlat (config değişince)
start-at-login = true

# Aksesuar pencereleri (örn. notifs) tile etme — float bırak
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Accordion modu için padding
accordion-padding = 30

# Default layout
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# macOS native fullscreen'i devre dışı bırak (aerospace yönetsin)
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Workspace'lere otomatik atama
# 1 = Arc        | 2 = Comet + Ghostty | 3 = Spotify | 4 = Slack + Obsidian

[[on-window-detected]]
if.app-id = 'org.qutebrowser.qutebrowser'  # qutebrowser
run = ['layout tiling', 'move-node-to-workspace 1']

[[on-window-detected]]
if.app-id = 'ai.perplexity.comet'         # Comet (Perplexity browser)
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'       # Terminal
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'com.spotify.client'          # Spotify
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'   # Slack
run = 'move-node-to-workspace 4'

[[on-window-detected]]
if.app-id = 'md.obsidian'                 # Obsidian
run = 'move-node-to-workspace 4'

# ───── Sistem dialog'ları → tiling DEĞİL, floating (modal'lar düzgün açılsın) ─────
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.finder'
if.window-title-regex-substring = 'Copy|Move|Get Info'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.calculator'
run = 'layout floating'

# Gaps
# outer.top = sketchybar yüksekliği (32) + ufak boşluk (8) = 40
# Böylece pencereler sketchybar'ı kapatmaz
[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.bottom = 8
outer.top = 40
outer.right = 8

# ============================================================
# KEYBINDINGS — Mod = Alt (Option). i3 muscle memory uyumlu.
# ============================================================

[mode.main.binding]

# Pencere odaklama (h/j/k/l)
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Pencere taşıma (Shift+hjkl)
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Layout değiştirme
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

# Pencereyi floating yap
alt-shift-space = 'layout floating tiling'

# Fullscreen toggle
alt-f = 'fullscreen'

# Resize modu
alt-shift-minus = 'resize smart -50'
alt-shift-equal = 'resize smart +50'

# Workspace'lere geçiş (1-9)
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

# Pencereyi workspace'e taşı
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'

# Workspace değiştir + odakla
alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# Service mode (config reload, restart)
alt-shift-semicolon = 'mode service'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']    # workspace'i sıfırla
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']

# Join modu — pencereleri birleştir
alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']

# Volume kontrolü (service mode'dayken)
down = 'volume down'
up = 'volume up'
shift-down = ['volume set 0', 'mode main']

# ============================================================
# Multi-monitor: workspace 2 ve 4 secondary monitör'e atanır
# ============================================================
[workspace-to-monitor-force-assignment]
2 = 'secondary'
4 = 'secondary'
